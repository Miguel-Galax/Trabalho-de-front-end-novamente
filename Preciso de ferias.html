<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Linktree</title>
    <!-- Vinculando o seu arquivo de estilo personalizado -->
    <link rel="stylesheet" href="ja tive ferias, mas mais ferias seria bom.css">
</head>
<body>

    <!-- Botão Flutuante para abrir o painel de edição (Engrenagem) -->
    <button class="btn-editar" onclick="togglePainel()">⚙️</button>

    <!-- Painel Administrativo de Edição (Estilizado pelo CSS) -->
    <div id="painelAdmin" class="painel-admin">
        <h2>Editar Perfil e Links</h2>
        
        <label for="editFoto">URL da Foto de Perfil:</label>
        <input type="text" id="editFoto" placeholder="Insira o link da foto (ex: https://...)">

        <label for="editNome">Nome:</label>
        <input type="text" id="editNome">

        <label for="editDescricao">Descrição:</label>
        <input type="text" id="editDescricao">

        <hr>
        <h3>Links (Nome e URL)</h3>

        <!-- O Javascript vai construir os campos de texto aqui dentro -->
        <div id="inputsLinksContainer"></div>

        <div class="painel-botoes">
            <button class="btn-salvar" onclick="salvarAlteracoes()">Salvar</button>
            <button class="btn-fechar" onclick="togglePainel()">Fechar</button>
        </div>
    </div>

    <!-- Estrutura Principal do Linktree -->
    <header class="perfil">
        <img src="" alt="Foto de Perfil" class="avatar" id="perfilFoto">
        <h1 id="perfilNome">Miguel Marques</h1>
        <p id="perfilDescricao">Desenvolvedor em formação | Viciado em tecnologia.</p>
    </header>

    <!-- Botão de Alternar Tema (já previsto no seu CSS original) -->
    <button id="btn-tema"></button>

    <main class="links-container" id="linksContainer">
        <!-- Os botões de links serão gerados dinamicamente pelo script.js -->
    </main>

    <footer>
        <p>Criado por Miguel &copy; 2026</p>
    </footer>

    <!-- Vinculando o arquivo de script modificado -->
    <script src="script.js"></script>
</body>
</html>
